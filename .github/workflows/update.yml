name: Refresh Notion KPI
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update.yml'
      - 'sync.mjs'
      - 'index.html'
      - 'movement.json'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh KPI data
        run: node sync.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WASH_DB_ID: '41e91f38-2801-81b3-8434-daa798bbe74f'
          NOTION_PAYROLL_DB_ID: '41e91f38-2801-8188-9818-c1e1c5200026'
          NOTION_DAILY_PAY_DB_ID: '41e91f38-2801-81a9-8351-d166f251aa38'
          NOTION_MOVEMENT_DB_ID: '42291f38-2801-812a-8961-eeb33499c8fc'
      - name: Commit latest KPI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet || (git commit -m 'Refresh KPI data' && git push)
