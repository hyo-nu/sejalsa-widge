name: Refresh Notion KPI
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update.yml'
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh KPI data
        run: node sync.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_WASH_DB_ID: ${{ secrets.NOTION_WASH_DB_ID }}
          NOTION_PAYROLL_DB_ID: ${{ secrets.NOTION_PAYROLL_DB_ID }}
      - name: Commit latest KPI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet || (git commit -m 'Refresh KPI data' && git push)
