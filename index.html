<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>세잘사 핵심 지표</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;background:transparent;font-family:system-ui,-apple-system,'Pretendard',sans-serif;color:light-dark(#1c2a3b,#f4f5f8)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.period{display:inline-flex;gap:3px;border-radius:10px;background:light-dark(#eef2f7,#333);padding:3px}
.period button{border:0;border-radius:8px;padding:8px 12px;background:transparent;color:inherit;font:600 12px inherit;cursor:pointer}
.period button[aria-pressed="true"]{background:light-dark(white,#50545b);box-shadow:0 1px 4px #0002;color:#387de4}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:light-dark(#fff,#222);border:1px solid light-dark(#e3e8f0,#444);border-radius:16px;padding:18px 16px;min-width:0}
.label{font-size:14px;color:light-dark(#64748b,#aaa);margin-bottom:12px}
.value{font-size:clamp(24px,4.6vw,42px);font-weight:800;letter-spacing:-1.2px;color:#387de4;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.meta{font-size:11px;color:#94a3b8;margin-top:9px}
.separator{font-size:12px;font-weight:700;color:light-dark(#64748b,#aaa);margin:14px 0 9px}
.extra{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.extra .card{padding:14px 12px}.extra .label{font-size:12px;margin-bottom:9px}.extra .value{font-size:clamp(16px,2.8vw,28px)}
.note{font-size:10px;line-height:1.5;color:light-dark(#7b8796,#a9b0bb);margin-top:9px}
@media(max-width:550px){.extra{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.extra{gap:8px}.card{padding:13px 11px}.value{font-size:25px}}
</style></head>
<body>
<div class="top"><div id="periodText" class="note" aria-live="polite">전체 기간</div><div class="period" role="group" aria-label="집계 기간">
<button id="all" type="button" aria-pressed="true">전체 누적</button><button id="month" type="button" aria-pressed="false">이번 달</button></div></div>
<main class="grid" id="cards" aria-live="polite"></main><div class="separator">이동 및 유류비</div><section class="extra" id="extra" aria-live="polite"></section>
<div class="note">유류비는 업무 이동거리 × 레이 2026년형 공인연비(12.9km/L)·기준 유가로 산정한 추정액입니다. '유류비 차감 예상 수익'은 작업일 기준 예상 보수에서 해당 연료비만 차감하며 보험·정비비·세금은 포함하지 않습니다. 실제 입금액은 정산건의 지급 예정일을 기준으로 월 분류합니다.</div>
<script>
const main=[['count','총 세차 대수','대'],['deposit','실제 입금액','원'],['averageMinutes','평균 작업 시간','분'],['hourly','시간당 수익','원']];
const extra=[['km','업무 이동거리','km'],['fuel','예상 유류비','원'],['afterFuel','유류비 차감 예상 수익','원']];
const nf=(v,key,unit)=>v==null?'—':Number(v).toLocaleString('ko-KR',{maximumFractionDigits:key==='averageMinutes'||key==='km'?1:0})+unit;
let data=null, period='all';
function cards(defs,d){return defs.map(([key,label,unit])=>'<article class="card"><div class="label">'+label+'</div><div class="value">'+(key==='afterFuel'&&!d.hasWorkIncome?'—':nf(d[key],key,unit))+'</div><div class="meta">'+(key==='afterFuel'?'세차 예상 보수 − 업무 유류비':'')+'</div></article>').join('')}
function render(){
 const now=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit'}).format(new Date()).slice(0,7);
 const d=period==='month'?(data.byMonth?.[now]??{count:0,deposit:0,averageMinutes:0,hourly:0,km:0,fuel:0,afterFuel:0,hasWorkIncome:false}):data;
 document.getElementById('cards').innerHTML=cards(main,d);
 document.getElementById('extra').innerHTML=cards(extra,d);
 document.getElementById('periodText').textContent=(period==='month'?now.replace('-','년 ')+'월':'전체 누적')+' · 마지막 집계 '+(data.updatedAt?new Date(data.updatedAt).toLocaleString('ko-KR'):'대기');
 for(const p of ['all','month'])document.getElementById(p).setAttribute('aria-pressed',String(p===period));
}
for(const p of ['all','month'])document.getElementById(p).addEventListener('click',()=>{period=p;if(data)render()});
async function run(){try{const r=await fetch('./data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Data unavailable');data=await r.json();render()}catch(e){document.getElementById('cards').textContent='데이터를 불러오지 못했습니다. GitHub Actions 실행 상태를 확인해 주세요.'}}
run();
</script></body></html>
