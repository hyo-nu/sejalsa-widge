<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>세잘사 핵심 지표</title><style>:root{color-scheme:light dark}body{margin:0;background:transparent;font-family:system-ui,-apple-system,'Pretendard',sans-serif}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:light-dark(#fff,#222);border:1px solid light-dark(#e3e8f0,#444);border-radius:16px;padding:20px 16px;min-width:0}.label{font-size:14px;color:light-dark(#64748b,#aaa);margin-bottom:12px}.value{font-size:clamp(26px,5vw,44px);font-weight:800;letter-spacing:-1.2px;color:#387de4;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.meta{font-size:11px;color:#94a3b8;margin-top:12px}@media(max-width:380px){.grid{gap:8px}.card{padding:14px 10px}.value{font-size:26px}}</style></head><body><main class="grid" id="cards" aria-live="polite"></main><script>const defs=[['count','총 세차 대수','대'],['deposit','실제 입금액','원'],['averageMinutes','평균 작업 시간','분'],['hourly','시간당 수익','원']];async function run(){const el=document.querySelector('#cards');try{const r=await fetch('./data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('data unavailable');const d=await r.json();el.innerHTML=defs.map(([key,label,unit])=>`<article class="card"><div class="label">${label}</div><div class="value">${d[key]==null?'—':Number(d[key]).toLocaleString('ko-KR',{maximumFractionDigits:key==='averageMinutes'?1:0})+unit}</div><div class="meta">${d.updatedAt?'마지막 집계 '+new Date(d.updatedAt).toLocaleString('ko-KR'):''}</div></article>`).join('')}catch(e){el.textContent='데이터를 불러오지 못했습니다. GitHub Actions 실행 상태를 확인해 주세요.'}}run();</script></body></html>
